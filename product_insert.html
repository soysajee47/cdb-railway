<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเพิ่มข้อมูลสินค้า - Add/Edit Product Form</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .product-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background-color: #ffffff;
            max-width: 520px;
            width: 100%;
        }
        /* Header สีเขียวตามตัวอย่างอาจารย์ */
        .card-header-custom {
            background-color: #2b8a3e;
            color: white;
            text-align: center;
            padding: 24px 20px 20px;
        }
        .card-header-custom h4 {
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card-header-custom p {
            font-size: 0.8rem;
            margin-bottom: 0;
            opacity: 0.9;
        }
        /* แถบเตือนสีเหลืองสำหรับโหมดแก้ไข */
        .edit-banner {
            background-color: #fff3bf;
            color: #856404;
            padding: 10px 20px;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #ffe066;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: #212529;
            margin-bottom: 6px;
        }
        .input-group-text {
            background-color: #f8f9fa;
            color: #495057;
            border-right: none;
        }
        .form-control, .form-select {
            border-left: none;
            font-size: 0.92rem;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
        /* แสดงเครื่องหมายถูก (Validation green icon) */
        .was-validated .form-control:valid, 
        .was-validated .form-select:valid {
            border-color: #198754;
            padding-right: calc(1.5em + .75rem);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%23198754' d='M2.3 6.73L.6 4.53a.75.75 0 011.06-1.06l1.17 1.17 3.47-3.47a.75.75 0 111.06 1.06L3.36 6.73a.75.75 0 01-1.06 0z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(.375em + .1875rem) center;
            background-size: calc(.75em + .375rem) calc(.75em + .375rem);
        }
        /* ปุ่มล้างข้อมูล */
        .btn-reset {
            border: 1px solid #ced4da;
            color: #495057;
            background-color: #fff;
            font-weight: 500;
        }
        .btn-reset:hover {
            background-color: #f8f9fa;
        }
        /* ปุ่มอัปเดตสีเหลืองส้ม */
        .btn-update {
            background-color: #f59f00;
            color: #fff;
            font-weight: 600;
            border: none;
        }
        .btn-update:hover {
            background-color: #f59f00;
            opacity: 0.9;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <div class="card-header-custom">
            <h4><i class="bi bi-box-seam"></i> ระบบจัดการข้อมูลสินค้า</h4>
            <p>กรอกรายละเอียดสินค้าเพื่อส่งข้อมูลไปประมวลผลและบันทึกลงฐานข้อมูล Server-Side</p>
        </div>

        <div class="edit-banner" id="editBanner">
            <i class="bi bi-pencil-square"></i>
            <span id="editBannerText">กำลังแก้ไขสินค้า รหัส: #138</span>
        </div>

        <div class="card-body p-4">
            <form id="frmProduct" class="needs-validation" novalidate>
                <input type="hidden" id="ProductID" name="ProductID" value="138">
                <input type="hidden" id="action" name="action" value="update">

                <div class="mb-3">
                    <label for="ProductName" class="form-label">ชื่อสินค้า (ProductName) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-box"></i></span>
                        <input type="text" class="form-control" id="ProductName" name="ProductName" value="Macbook Pro Ultra M6" required>
                        <div class="invalid-feedback">กรุณากรอกชื่อสินค้า</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="SupplierID" class="form-label">ผู้จัดจำหน่าย (SupplierID) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-building"></i></span>
                        <select class="form-select" id="SupplierID" name="SupplierID" required>
                            <option value="">-- เลือกผู้จัดจำหน่าย --</option>
                            <option value="SUP001">SUP001 - บริษัท เอบีซี จำกัด</option>
                            <option value="SUP002" selected>SUP002 - บริษัท สยามโกลบอลเฮ้าส์ จำกัด</option>
                            <option value="SUP003">SUP003 - บริษัท ไอทีซิสเต็มส์ จำกัด</option>
                        </select>
                        <div class="invalid-feedback">กรุณาเลือกผู้จัดจำหน่าย</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="CatID" class="form-label">หมวดหมู่สินค้า (CatID) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-grid-fill"></i></span>
                        <select class="form-select" id="CatID" name="CatID" required>
                            <option value="">-- เลือกหมวดหมู่สินค้า --</option>
                            <option value="CAT01">CAT01 - เครื่องใช้ไฟฟ้า</option>
                            <option value="CAT02">CAT02 - เครื่องใช้ในบ้าน</option>
                            <option value="CAT03" selected>CAT03 - อาหารและเครื่องดื่ม (Food & Beverage)</option>
                        </select>
                        <div class="invalid-feedback">กรุณาเลือกหมวดหมู่สินค้า</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="Unit" class="form-label">หน่วยนับ (Unit) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-hash"></i></span>
                        <input type="text" class="form-control" id="Unit" name="Unit" value="เครื่อง" required>
                        <div class="invalid-feedback">กรุณากรอกหน่วยนับ</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="Price" class="form-label">ราคาสินค้า (Price) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                        <input type="number" step="0.01" class="form-control" id="Price" name="Price" value="120000" required>
                        <div class="invalid-feedback">กรุณากรอกราคาให้ถูกต้อง</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="Quantity" class="form-label">จำนวนคงเหลือ (Quantity) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-layers"></i></span>
                        <input type="number" class="form-control" id="Quantity" name="Quantity" value="1" required>
                        <div class="invalid-feedback">กรุณากรอกจำนวนคงเหลือ</div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-reset py-2" id="btnReset">
                        <i class="bi bi-arrow-clockwise"></i> ล้างข้อมูล / เพิ่มใหม่
                    </button>
                    <button type="submit" class="btn btn-update py-2" id="btnSubmit">
                        <i class="bi bi-check-lg"></i> อัปเดตข้อมูลสินค้า
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('frmProduct');

        // แสดงสถานะ Validated (เครื่องหมายถูกต้องสีเขียว) ตามตัวอย่างของอาจารย์
        form.classList.add('was-validated');

        // ส่งข้อมูลแบบ AJAX (Fetch) ไปที่ process_product.php
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            if (!form.checkValidity()) {
                event.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            const formData = new FormData(form);

            fetch('process_product.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success Response:', data);
                alert('ส่งข้อมูลสำเร็จ! ตรวจสอบผลลัพธ์ใน Network Tab ของเบราว์เซอร์');
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            });
        });

        // ปุ่มล้างข้อมูล / เพิ่มใหม่
        document.getElementById('btnReset').addEventListener('click', function() {
            form.reset();
            form.classList.remove('was-validated');
            document.getElementById('action').value = 'insert';
            document.getElementById('ProductID').value = '';
            document.getElementById('editBanner').style.display = 'none';
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.className = 'btn btn-success py-2';
            btnSubmit.innerHTML = '<i class="bi bi-cloud-arrow-up"></i> บันทึกข้อมูลสินค้า';
        });
    </script>
</body>
</html>
